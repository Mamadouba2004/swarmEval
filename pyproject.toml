[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmeval"
version = "0.1.0"
description = "Evaluation, observability, diagnostics and causal analysis for multi-agent AI systems."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Rohit Penta"}]
keywords = ["multi-agent", "evaluation", "observability", "llm", "agents", "ablation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
parquet = ["pyarrow>=14"]
dev = ["pytest>=7"]

[project.scripts]
swarmeval = "swarmeval.cli:main"

[tool.setuptools.packages.find]
include = ["swarmeval*"]  # the demo swarm ships as swarmeval.examples

[tool.pytest.ini_options]
testpaths = ["tests"]
